set httpd unixsocket /var/run/monit.sock
  uid root
  gid wheel
  permission 700
  allow mdci:mdcimonitcli

check process mdcid
  with pidfile /usr/local/mdci/.daemon.pid
  start program = "/usr/sbin/service mdcid start"
  stop program = "/usr/sbin/service mdcid stop"
  if 2 restarts within 2 cycles then exec "/usr/local/etc/mdci-monit-scripts/slackServiceAlert.sh mdcid"
  repeat every 1 cycles

check program mdcid-progress with path "/usr/local/sbin/mdci-daemon-progress"
  if status != 0 then exec "/usr/local/etc/mdci-monit-scripts/slackServiceAlert.sh mdcid"
  repeat every 240 cycles
